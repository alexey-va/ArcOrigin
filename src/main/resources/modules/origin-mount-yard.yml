# Mount-yard animal ownership and interaction defaults.
#
# The stable Citizens NPC UUID is the ownership fence, not the spawned entity
# UUID, which changes after a respawn. A reused numeric NPC ID is never enough.
world: rc_origin_spawn
max-interaction-range: 4.0
speech-duration-ticks: 50
friendly-sound: BLOCK_AMETHYST_BLOCK_CHIME

interaction:
  pet-window: 6s
  pet-cooldown: 750ms
  pets-before-annoyed: 4
  annoyed-duration: 10s
  max-tracked-states: 4096
  reaction-damage: 2.0

animals:
  "371":
    name: Ветер
    entity-type: HORSE
    npc-uuid: 73ac6c29-6b4a-4d4b-8303-cc9b9da20d1f
    friendly-lines:
      - "Ветер доверчиво тянется к ладони."
      - "Хороший конь. Ветер довольно переступает копытом."
    warning-lines:
      - "Ветер дёргает ушами: хватит щекотать."
      - "Ещё одна ладонь — и Ветер начнёт сердиться."
    annoyed-sound: ENTITY_HORSE_ANGRY
  "413":
    name: Иней
