# ARC owns the interactive meals in both Origin restaurants.

# Small, bounded choreography. ARC owns these props; no Denizen tasks.
life:
  audience-range: 24.0
  effect-range: 14.0
  max-active-cycles: 4
  serving-ticks: 16
  bite-interval-min-ticks: 400
  bite-interval-max-ticks: 650
  bite-duration-ticks: 24
  steam-duration-ticks: 200
  bartender-rest-min-ticks: 120
  bartender-rest-max-ticks: 200
  hand-side: 0.32
  hand-forward: 0.45
  hand-height: 1.05
  pour-height: 0.3
  drink-table-offset-x: 0.38
  drink-table-offset-z: 0.0
  drink-full-ticks: 900
  drink-empty-ticks: 300
  # GROUND bounds, scale .65. Mug rests exactly on the carpet at y=73.0625.
  mug: {item: "elitecreatures:restaurant_mug_full", scale: 0.65, surface-lift: 0.20475}
  empty-mug: {item: "elitecreatures:restaurant_mug_empty", scale: 0.65, surface-lift: 0.20475}
  pouring-bottle: {item: "elitecreatures:restaurant_pouring_bottle", scale: 0.65, surface-lift: 0.20475}
  bottle-mouth-y: 0.2998125
  empty-plate: {item: "elitecreatures:restaurant_food_eggbeacon_empty", scale: 0.65, surface-lift: 0.24375}
  empty-plate-dish-ids: [egg, fish, steak]
  empty-plates:
    egg: {item: "elitecreatures:restaurant_food_eggbeacon_empty", scale: 0.65, surface-lift: 0.24375}
    fish: {item: "elitecreatures:restaurant_food_halffish_empty", scale: 0.65, surface-lift: 0.08125}
    steak: {item: "elitecreatures:restaurant_food_steak_empty", scale: 0.65, surface-lift: 0.24375}
  bartender-ids: ["439"]
  bartenders:
    439:
      station: "-52.5,73.0625,56.5,0"
      waiter-ids: ["431", "432"]
  ready-lines:
    - "Кружки готовы. Только с пеной осторожнее."
    - "Свежая порция — можно забирать."
    - "Вот теперь порядок. Следующий заказ!"
  empty-lines:
    - "Спасибо, было вкусно."
    - "Можно убрать тарелку."
    - "Хороший ужин получился."

conversation:
  minimum-line-millis: 1800
  maximum-line-millis: 7000
  characters-per-second: 12.0
  pause-between-lines-millis: 600
  gesture-every-lines: 2
  pair-cooldown-millis: 15000
  venue-cooldown-millis: 3000
  execution-timeout-millis: 120000

# Run /arc reload after editing this file; no server restart is required.

placement:
  # Every dish starts exactly at the center of the block directly in front of
  # the seated player. These values only provide intentional fine tuning.
  forward-blocks: 1.0
  vertical-offset-blocks: 0.0
  tables:
    brewery_south_west:
      seat: "-7.5,70.0,37.5,-90"
      clicked-block: "-8,70,37"
      waiter-stop: "-7.5,70.0,38.5,0"
      waiter-id: 410
      height-above-seat: 1.0
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
    brewery_south_east:
      seat: "-3.5,70.0,37.5,90"
      clicked-block: "-4,70,37"
      waiter-stop: "-3.5,70.0,38.5,180"
      waiter-id: 410
      height-above-seat: 1.0
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
    brewery_fire:
      seat: "-8.5,70.0,48.5,180"
      clicked-block: "-9,70,48"
      waiter-stop: "-6.5,70.0,48.5,90"
      waiter-id: 411
      height-above-seat: 0.75
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
    brewery_west:
      seat: "-13.5,70.0,53.5,90"
      clicked-block: "-14,70,53"
      waiter-stop: "-13.5,70.0,55.5,180"
      waiter-id: 411
      height-above-seat: 1.0
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
    restaurant_a:
      seat: "-54.5,72.0,48.5,180"
      clicked-block: "-55,72,48"
      waiter-stop: "-52.5,72.0,46.5,180"
      waiter-id: 431
      height-above-seat: 1.0
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
    restaurant_b:
      seat: "-47.5,72.0,52.5,180"
      clicked-block: "-48,72,52"
      waiter-stop: "-50.5,72.0,50.5,180"
      waiter-id: 432
      height-above-seat: 1.0
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0

display:
  # Culling bounds only affect visibility, not the model's physical size.
  view-range: 2.0
  culling-width: 4.0
  culling-height: 4.0
  # surface-lift values come from the actual ItemsAdder model bounds with the
  # GROUND transform. The plate bottom touches the table without extra clearance.
  dishes:
    egg:
      scale: 0.65
      surface-lift: 0.24375
    fish:
      scale: 0.65
      surface-lift: 0.08125
    steak:
      scale: 0.65
      surface-lift: 0.24375
    herbal_tea:
      scale: 0.65
      surface-lift: 0.24475
    berry_kvass:
      scale: 0.65
      surface-lift: 0.24475
    spiced_mead:
      scale: 0.65
      surface-lift: 0.24475

interaction:
  meal-hitbox-size: 1.8
  meal-hitbox-y-offset: -0.15
  waiter-hitbox-width: 1.4
  waiter-hitbox-height: 2.2
  ambient-dialogue-range: 8.0
  # Speech only starts while at least one player can actually see this table.
  ambient-audience-range: 24.0
  # Keep temporary speech above the permanent Citizens nameplate and readable
  # against both the bright windows and the dark interior.
  ambient-speech-height: 2.8
  ambient-speech-view-range: 1.25
  ambient-speech-scale: 1.1

timing:
  delivery-fallback-ticks: 20
  service-pause-ticks: 12
  next-delivery-ticks: 10
  waiter-poll-ticks: 10
  waiter-max-polls: 20
  delivery-route-max-polls: 30
  ambient-route-max-polls: 36
  waiter-return-release-ticks: 120
  progress-log-every-polls: 4
  theft-cooldown-seconds: 90
  session-ttl-seconds: 300
  dialog-authorization-seconds: 60
  customer-call-delay-ticks: 20
  player-service-cooldown-seconds: 120
  # Background life uses ranges so guests and waiters do not act on one clock.
  ambient-dialogue-min-seconds: 12
  ambient-dialogue-max-seconds: 20
  ambient-reply-delay-min-ticks: 18
  ambient-reply-delay-max-ticks: 42
  ambient-look-hold-min-ticks: 32
  ambient-look-hold-max-ticks: 68
  ambient-speech-duration-ticks: 200
  ambient-retry-seconds: 5
  guest-reconcile-seconds: 5
  # Each waiter returns to base first, then pauses there for a different interval.
  ambient-waiter-rest-min-seconds: 3
  ambient-waiter-rest-max-seconds: 6

navigation:
  waiter-ready-margin: 2.25
  # Must stay within normal survival entity-interaction reach.
  waiter-player-range: 1.8
  distance-margin: 0.35
  path-distance-margin: 0.35
  # ARC builds a bounded four-way path only through safe cells on this floor,
  # then gives Citizens the complete prepared route. Tables and chairs can
  # therefore never become route shortcuts.
  grid-max-visited: 1024
  grid-poll-ticks: 2
  grid-stall-polls: 20
  grid-snap-radius: 3
  grid-off-floor-tolerance: 0.45
  # Profiles bound every route to its venue. Add hard no-go rectangles to
  # forbidden-areas and cheap preferred corridors to preferred-areas. Code may
  # also supply ordered via points when an NPC must pass through exact gates.
  # Rectangle format: min-x,min-z,max-x,max-z.
  route-profile-ids: [brewery, restaurant]
  route-profiles:
    brewery:
      floor-y: 70
      min-block: "-22,70,35"
      max-block: "4,70,64"
      forbidden-areas: []
      preferred-areas: []
      # Extra clearance around ItemsAdder furniture converted to blocked cells.
      entity-obstacle-padding: 0.25
      obstacle-refresh-polls: 10
      heading-look-ahead-cells: 2
      heading-update-ticks: 1
      heading-max-turn-degrees-per-tick: 18.0
      corner-smoothing-distance: 0.75
      corner-smoothing-lead: 0.30
      maximum-step-height: 0.125
      speed-modifier: 0.72
    restaurant:
      floor-y: 72
      min-block: "-61,72,40"
      max-block: "-40,72,62"
      forbidden-areas: []
      preferred-areas: []
      entity-obstacle-padding: 0.25
      obstacle-refresh-polls: 10
      heading-look-ahead-cells: 2
      heading-update-ticks: 1
      heading-max-turn-degrees-per-tick: 18.0
      corner-smoothing-distance: 0.75
      corner-smoothing-lead: 0.30
      maximum-step-height: 0.125
      speed-modifier: 0.72
  session-radius: 8.0

seating:
  guest-marker-lift: 0.6
  guest-entity-lift: 0.4
  # ARC starts service only after the chair plugin has actually mounted the player.
  confirm-delay-ticks: 2
  confirm-max-polls: 3
  confirm-horizontal-radius: 1.0

dynamic-seats:
  # Любая нижняя ступенька внутри территории пивоварни или ресторана становится
  # местом для игрока. Если перед ней нет блока/стола, открывается меню напитков,
  # а купленная бутылка выдаётся в инвентарь.
  table-height-above-seat: 1.0
  dish-offset-x: 0.0
  dish-offset-y: 0.0
  dish-offset-z: 0.0
  waiter-side-offset: 1.0
  # Для ItemsAdder-мебели направление сначала определяется по соседнему столу.
  # yaw-offset используется как резерв, а смещения задаются в локальных осях модели.
  furniture-profile-ids: [wooden_chairs]
  furniture-profiles:
    wooden_chairs:
      ids:
        - "furnituresplus:red_wooden_chair"
        - "furnituresplus:white_wooden_chair"
        - "furnituresplus:cyan_wooden_chair"
        - "furnituresplus:gray_wooden_chair"
        - "furnituresplus:iron_chair"
        - "furnituresplus:amethyst_chair"
      yaw-offset: 180.0
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
      require-table: true

# Все координаты двух ресторанных сцен находятся здесь и перечитываются через
# /arc reload. Формат точки: x,y,z,yaw. Формат блока: x,y,z.
scene:
  ambient-cycle-min-seconds: 18
  ambient-cycle-max-seconds: 30
  # The actual count is chosen randomly from one to this limit each cycle.
  ambient-routes-per-cycle: 2
  # ARC ищет обычные нижние ступеньки со столом в соседнем блоке, рассаживает
  # этих посетителей ближе к их резервным точкам и сохраняет места для игроков.
  auto-seating:
    zone-ids: [brewery, restaurant]
    zones:
      brewery:
        guest-ids: ["416", "417", "418", "419", "420"]
        min-block: "-19,70,39"
        max-block: "-1,70,54"
        load-chunks: true
        minimum-free-seats: 1
        excluded-blocks: []
      restaurant:
        guest-ids: ["433", "434", "435", "436"]
        min-block: "-58,72,43"
        max-block: "-43,72,53"
        load-chunks: true
        minimum-free-seats: 2
        excluded-blocks: []
  # Одноразово заменяет старую раскладку и barrier-маркеры обычными ступеньками.
  seat-layout-version: 3
  authored-seat-ids: []
  authored-seat-points:
    - "-16.5,70.0,40.5,-90"
    - "-14.5,70.0,40.5,90"
    - "-16.5,70.0,47.5,-90"
    - "-14.5,70.0,47.5,90"
    - "-2.5,70.0,47.5,180"
    - "-2.5,70.0,45.5,0"
    - "-13.5,70.0,53.5,90"
    - "-15.5,70.0,53.5,-90"
  retired-seat-blocks:
    - "-18,70,40"
    - "-14,70,40"
    - "-18,70,47"
    - "-14,70,47"
    - "-3,70,48"
    - "-3,70,44"
  cleanup-points:
    - "-0.5,72.4,53.5,0" # бывшая реплика удалённой Тэссы
  legacy-furniture-cleanup:
    ids:
      - "elitecreatures:restaurant_food_steak"
      - "elitecreatures:medieval_market_decoration_v2_table_2"
    points:
      - "-15.5,71.1,47.5,180"
      - "-15.5,70.001,40.5,0"
      - "-15.5,70.001,47.5,0"
      - "-2.5,70.001,46.5,0"
      - "-4.5,70.001,37.5,0"
  legacy-player-table:
