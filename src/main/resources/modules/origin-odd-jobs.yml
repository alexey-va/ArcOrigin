    introduction: "Эдгар чередует ковку, перевозку сырья на тележке и гравировку у Луки. Готовые изделия сдавай Эдгару, а сырьё загрузи в тележку, довези до сундука и разгрузи. Следуй подсветке и верхней полосе."
