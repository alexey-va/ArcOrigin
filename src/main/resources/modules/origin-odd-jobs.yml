    introduction: "Сено отнеси в кормушку — лошадь поест сама, а ты получишь следующее поручение. Для прогулки открой стойло, приведи лошадь в подсвеченную развязку, закрепи оба повода, почисти и оседлай. Затем сними оба повода и выведи её наружу к Мирону: он примет лошадь и отправится в поле. Новые поручения появляются автоматически."
