  mountyard:
    title: "Смена · Конюшня"
    introduction: "Сеня поручает кормление, поение, подготовку лошадей, уроки верховой езды и уборку стойл. Для урока подготовь лошадь, посади Мирона и веди её на поводе через отметки поля. Предметы бери прямо со стойки. ЛКМ и ПКМ работают одинаково. После поездки сними и верни уздечку, седло и вальтрап. После поения верни ведро, после уборки — пустую тачку и лопату. Следующее поручение появится автоматически."
    waiting: "Лошади заняты · подожди немного"
